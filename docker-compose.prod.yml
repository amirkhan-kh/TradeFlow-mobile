# Production API host: PostgreSQL + Express API behind Caddy (automatic HTTPS).
# Frontend runs on Vercel and proxies /api/v1/* here via API_INTERNAL_URL=https://$API_DOMAIN.
# Usage: cp .env.example .env  →  fill values  →  docker compose -f docker-compose.prod.yml up -d --build
name: tradeflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tradeflow}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradeflow}"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tradeflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tradeflow}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SEED_DEMO: ${SEED_DEMO:-false}
      COOKIE_SECURE: "true"
      MOBILE_ANDROID_MIN: ${MOBILE_ANDROID_MIN:-1.0.0}
      MOBILE_ANDROID_LATEST: ${MOBILE_ANDROID_LATEST:-1.0.0}
      MOBILE_IOS_MIN: ${MOBILE_IOS_MIN:-1.0.0}
      MOBILE_IOS_LATEST: ${MOBILE_IOS_LATEST:-1.0.0}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      # first boot runs migrations + optional demo seed (a year of history, several minutes on 1 vCPU)
      start_period: 900s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  caddy_data:
  caddy_config:
